# CTC Decoding, beam size 1 (greedy)
# 使用 best_ctc.pth（CTC 性能最好的 checkpoint）
src:
  ckpt: 'ckpt/asr_example_sd0/best_ctc.pth'
  config: 'config/aishell/asr_example.yaml'
data:
  corpus:
    name: 'aishell'
    dev_split: ['dev']
    test_split: ['test']
decode:
  beam_size: 1
  min_len_ratio: 0.01
  max_len_ratio: 0.1
  vocab_candidate: 30
  lm_path: ''
  lm_config: ''
  lm_weight: 0.0
  ctc_weight: 1.0
