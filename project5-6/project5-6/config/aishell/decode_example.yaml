# Most of the parameters will be imported from the training config
src:
  ckpt: 'ckpt/asr_example_sd0/best_att.pth'
  config: 'config/aishell/asr_example.yaml'
data:
  corpus:
    name: 'aishell'
    dev_split: ['dev']
    test_split: ['test']
decode:
  beam_size: 20
  min_len_ratio: 0.01
  max_len_ratio: 0.1
  lm_path: 'ckpt/lm_example_sd0/best_ppx.pth'
  lm_config: 'config/aishell/lm_example.yaml'
  lm_weight: 0.0
  ctc_weight: 0.5
