# Joint CTC-Attention Beam Decoding, beam size 20
# 使用 best_att.pth（Joint 解码需要完整的 attention decoder）
src:
  ckpt: 'ckpt/asr_example_sd0/best_att.pth'
  config: 'config/aishell/asr_example.yaml'
data:
  corpus:
    name: 'aishell'
    dev_split: ['dev']
    test_split: ['test']
decode:
  beam_size: 20
  min_len_ratio: 0.01
  max_len_ratio: 0.1
  lm_path: ''
  lm_config: ''
  lm_weight: 0.0
  ctc_weight: 0.5
